# ==============================================================================
# Configuração Central Multi-LLM para Ruadan + red-MPPO
# ==============================================================================

active_provider: "ollama"  # ollama | google | openai | anthropic | deepseek | nvidia
active_model: "qwen3:8b"

providers:
  ollama:
    name: "Ollama Local (Docker/Host)"
    base_url: "http://localhost:11434/v1"
    api_key_env: null
    api_key_default: "ollama"
    default_model: "qwen3:8b"
    timeout: 300
    models:
      - "qwen3:8b"
      - "gpt-oss:20b"
      - "llama3.1:8b"
      - "deepseek-r1:8b"

  google:
    name: "Google Gemini API"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GEMINI_API_KEY"
    api_key_default: null
    default_model: "gemini-2.5-flash"
    timeout: 90
    models:
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-1.5-pro"
      - "gemini-1.5-flash"

  openai:
    name: "OpenAI API"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    api_key_default: null
    default_model: "gpt-4o"
    timeout: 90
    models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "o1"
      - "o3-mini"

  anthropic:
    name: "Anthropic Claude API"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    api_key_default: null
    default_model: "claude-3-5-sonnet-20241022"
    timeout: 90
    models:
      - "claude-3-7-sonnet-20250219"
      - "claude-3-5-sonnet-20241022"
      - "claude-3-5-haiku-20241022"

  deepseek:
    name: "DeepSeek API"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    api_key_default: null
    default_model: "deepseek-chat"
    timeout: 120
    models:
      - "deepseek-chat"
      - "deepseek-reasoner"

  nvidia:
    name: "NVIDIA NIM (Free / Cloud API)"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    api_key_default: null
    default_model: "meta/llama-3.3-70b-instruct"
    timeout: 90
    models:
      - "meta/llama-3.3-70b-instruct"
      - "meta/llama-3.1-8b-instruct"
      - "mistralai/mistral-large-2-instruct"
      - "nvidia/llama-3.1-nemotron-70b-instruct"
      - "deepseek-ai/deepseek-r1"
